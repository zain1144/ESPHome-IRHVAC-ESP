substitutions:
  device_name: ir-blaster
  friendly_name: IR Blaster

  # Use GPIO numbers only, without D or GPIO prefixes.
  # Default ESP32-S3 pins. Change them to match your board.
  tx_gpio: "4"
  rx_gpio: "5"

  # Native IRremoteESP8266 receiver settings.
  # The large buffer and 50 ms timeout support long HVAC frames.
  ir_receive_buffer_size: "1024"
  ir_receive_timeout_ms: "50"
  ir_receive_tolerance: "25"
  ir_receive_pullup: "true"

  # Tasmota-compatible MQTT topic layout.
  mqtt_command_topic: cmnd/ir-blaster/IRHVAC
  mqtt_command_topic_lower: cmnd/ir-blaster/irhvac
  mqtt_result_topic: stat/ir-blaster/RESULT
  mqtt_tele_result_topic: tele/ir-blaster/RESULT
  mqtt_lwt_topic: tele/ir-blaster/LWT

  # IRremoteESP8266 v2.9.0 plus a minimal ESPHome timing-output bridge.
  ir_library_source: https://github.com/zain1144/IRremoteESP8266-ESPHome-LibreTiny.git#esphome-libretiny
  ir_controller_source: https://github.com/zain1144/ESPHome-IRHVAC-ESP.git#main

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  libraries:
    - IRremoteESP8266=${ir_library_source}
    - ESPHomeIRHVACESPController=${ir_controller_source}
  includes:
    - <irhvac_esp_controller.h>
  on_boot:
    priority: -100
    then:
      - lambda: |-
          esphome_irhvac_esp::setup(
              id(ir_tx),
              ${tx_gpio},
              ${rx_gpio},
              ${ir_receive_buffer_size},
              ${ir_receive_timeout_ms},
              ${ir_receive_tolerance},
              ${ir_receive_pullup});

# ESP32-S3 DevKitC-1.
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:

ota:
  - platform: esphome

web_server:
  port: 80

# ESP32 uses its hardware RMT peripheral for stable carrier and envelope
# timing. Blocking mode keeps the receiver paused until the frame is complete.
remote_transmitter:
  id: ir_tx
  pin: ${tx_gpio}
  carrier_duty_percent: 50%
  non_blocking: false

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password

  birth_message:
    topic: ${mqtt_lwt_topic}
    payload: Online
    retain: true
  will_message:
    topic: ${mqtt_lwt_topic}
    payload: Offline
    retain: true
  shutdown_message:
    topic: ${mqtt_lwt_topic}
    payload: Offline
    retain: true

  on_json_message:
    # Accept a Tasmota-style IRHVAC object on either topic spelling.
    - topic: ${mqtt_command_topic}
      then:
        - lambda: |-
            auto result = esphome_irhvac_esp::send_object(x, "MQTT");
            id(mqtt_client).publish(
                "${mqtt_result_topic}", result.response_json, 0, false);

    - topic: ${mqtt_command_topic_lower}
      then:
        - lambda: |-
            auto result = esphome_irhvac_esp::send_object(x, "MQTT");
            id(mqtt_client).publish(
                "${mqtt_result_topic}", result.response_json, 0, false);

# IRrecv captures and decodes directly through IRremoteESP8266.
# Do not add another receiver or transmitter on these GPIOs.
interval:
  - interval: 20ms
    then:
      - lambda: |-
          auto result = esphome_irhvac_esp::receive();
          if (result.publish) {
            id(mqtt_client).publish(
                "${mqtt_tele_result_topic}", result.response_json, 0, false);
          }

substitutions:
  device_name: ir-blaster
  friendly_name: IR Blaster

  # Use GPIO numbers only, without D or GPIO prefixes.
  # On a D1 mini, D2 is GPIO4 and D5 is GPIO14.
  tx_gpio: "4"
  rx_gpio: "14"

  # Native IRremoteESP8266 receiver settings.
  # The large buffer and 50 ms timeout support long HVAC frames.
  ir_receive_buffer_size: "1024"
  ir_receive_timeout_ms: "50"
  ir_receive_tolerance: "25"
  ir_receive_pullup: "true"

  # Tasmota-compatible MQTT topic layout.
  mqtt_command_topic: cmnd/ir-blaster/IRHVAC
  mqtt_command_topic_lower: cmnd/ir-blaster/irhvac
  mqtt_result_topic: stat/ir-blaster/RESULT
  mqtt_tele_result_topic: tele/ir-blaster/RESULT
  mqtt_lwt_topic: tele/ir-blaster/LWT

  # Official IRremoteESP8266 plus this repository's ESPHome adapter.
  ir_library_source: https://github.com/crankyoldgit/IRremoteESP8266.git#v2.9.0
  ir_controller_source: https://github.com/zain1144/ESPHome-IRHVAC-ESP.git#main

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  libraries:
    - IRremoteESP8266=${ir_library_source}
    - ESPHomeIRHVACESPController=${ir_controller_source}
  includes:
    - <irhvac_esp_controller.h>
  on_boot:
    priority: -100
    then:
      - lambda: |-
          esphome_irhvac_esp::setup(
              ${tx_gpio},
              ${rx_gpio},
              ${ir_receive_buffer_size},
              ${ir_receive_timeout_ms},
              ${ir_receive_tolerance},
              ${ir_receive_pullup});

# ESP8266 D1 mini / NodeMCU.
esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:

ota:
  - platform: esphome

web_server:
  port: 80

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password

  birth_message:
    topic: ${mqtt_lwt_topic}
    payload: Online
    retain: true
  will_message:
    topic: ${mqtt_lwt_topic}
    payload: Offline
    retain: true
  shutdown_message:
    topic: ${mqtt_lwt_topic}
    payload: Offline
    retain: true

  on_json_message:
    # Accept a Tasmota-style IRHVAC object on either topic spelling.
    - topic: ${mqtt_command_topic}
      then:
        - lambda: |-
            auto result = esphome_irhvac_esp::send_object(x, "MQTT");
            id(mqtt_client).publish(
                "${mqtt_result_topic}", result.response_json, 0, false);

    - topic: ${mqtt_command_topic_lower}
      then:
        - lambda: |-
            auto result = esphome_irhvac_esp::send_object(x, "MQTT");
            id(mqtt_client).publish(
                "${mqtt_result_topic}", result.response_json, 0, false);

# IRrecv captures and decodes directly through the official library.
# Do not add ESPHome remote_receiver or remote_transmitter on these GPIOs.
interval:
  - interval: 20ms
    then:
      - lambda: |-
          auto result = esphome_irhvac_esp::receive();
          if (result.publish) {
            id(mqtt_client).publish(
                "${mqtt_tele_result_topic}", result.response_json, 0, false);
          }
